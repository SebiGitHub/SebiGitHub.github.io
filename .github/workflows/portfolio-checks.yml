name: Portfolio checks and CV
on:
  push:
    branches: [main]
    paths-ignore: ["assets/cv/*.pdf"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-validation
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-package-lock
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-validation
          path: |
            playwright-report/
            test-results/
            assets/cv/CV_ES.pdf
            assets/cv/CV_EN.pdf
